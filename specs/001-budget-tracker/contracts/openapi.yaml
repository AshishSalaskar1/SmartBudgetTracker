openapi: 3.0.3
info:
  title: SmartBudgetTracker API
  version: 0.1.0
servers:
  - url: http://localhost:8000
paths:
  /api/auth/login:
    post:
      summary: Login with username/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: Invalid credentials
  /api/auth/logout:
    post:
      summary: Logout current session
      responses:
        '200':
          description: Logged out
  /api/auth/me:
    get:
      summary: Current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401':
          description: Not authenticated
  /api/statements/upload:
    post:
      summary: Upload and extract a monthly statement
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - in: query
          name: year
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - in: query
          name: replace
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Extraction successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementSummary'
        '409':
          description: Statement already exists (replace required)
        '422':
          description: Extraction failed or unsupported file
  /api/statements:
    get:
      summary: List statements for current user
      responses:
        '200':
          description: Statements list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Statement'
  /api/summary:
    get:
      summary: Monthly summary stats
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - in: query
          name: year
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        '200':
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementSummary'
  /api/summary/yearly:
    get:
      summary: Yearly summary stats
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        '200':
          description: Yearly summary stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearlySummary'
  /api/transactions:
    get:
      summary: Transactions for a month/year
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - in: query
          name: year
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    AuthUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
    Statement:
      type: object
      properties:
        id:
          type: string
        month:
          type: integer
        year:
          type: integer
        status:
          type: string
        uploaded_at:
          type: string
          format: date-time
    Transaction:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        description:
          type: string
        category:
          type: string
        reason:
          type: string
        amount:
          type: number
          format: float
        direction:
          type: string
          enum: [credit, debit]
    StatementSummary:
      type: object
      properties:
        month:
          type: integer
        year:
          type: integer
        total_income:
          type: number
        total_expense:
          type: number
        net:
          type: number
        transaction_count:
          type: integer
        top_merchants:
          type: array
          items:
            type: object
            properties:
              merchant:
                type: string
              amount:
                type: number
        daily_spend:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              amount:
                type: number
    YearlySummary:
      type: object
      properties:
        year:
          type: integer
        total_income:
          type: number
        total_expense:
          type: number
        net:
          type: number
        transaction_count:
          type: integer
        monthly_totals:
          type: array
          items:
            type: object
            properties:
              month:
                type: integer
              income:
                type: number
              expense:
                type: number
              net:
                type: number
        category_totals:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              amount:
                type: number
